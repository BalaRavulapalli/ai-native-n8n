version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meridian_clients
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_demo_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian_clients"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_PUBLIC_API_DISABLED=false
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Backend and frontend run locally for dev. Uncomment for full Docker deployment:
  # backend:
  #   build: ./backend
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - N8N_BASE_URL=http://n8n:5678
  #     - N8N_API_KEY=${N8N_API_KEY}
  #     - QDRANT_URL=http://qdrant:6333
  #     - POSTGRES_HOST=postgres
  #     - POSTGRES_PORT=5432
  #     - POSTGRES_DB=meridian_clients
  #     - POSTGRES_USER=meridian
  #     - POSTGRES_PASSWORD=meridian_demo_2026
  #     - FRONTEND_URL=http://localhost:3000
  #   ports:
  #     - "8000:8000"
  #   depends_on: [postgres, qdrant, n8n]
  #
  # frontend:
  #   build: ./frontend
  #   environment:
  #     - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
  #   ports:
  #     - "3000:3000"
  #   depends_on: [backend]

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
